services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker_postgres
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tracker_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: tracker_meili
    environment:
      MEILI_MASTER_KEY: dev_master_key_change_me
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  api:
    image: node:22-alpine
    container_name: tracker_api
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://tracker:tracker@postgres:5432/tracker
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: dev_master_key_change_me
      ANNOUNCE_INTERVAL_SECONDS: 1800
      ANNOUNCE_MIN_INTERVAL_SECONDS: 900
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:22-alpine
    container_name: tracker_frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  redisdata:
  meilidata:
